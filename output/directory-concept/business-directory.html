<script>
(() => {
 const root=document.getElementById('fm-directory');
 const templates=new Map(Array.from(root.querySelectorAll('template')).map(t=>[t.dataset.template,t]));
 const initial=window.openai?.widgetState?.privateContent||{};
 const shared={interested:!!initial.interested,notify:!!initial.notify};
 const controllers=[];
 const pages=['search','detail','saved','claim','pending','report','sample'];
 function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{concept:'FitsMyTime business directory',interested:shared.interested,notifications:shared.notify},privateContent:{...shared,screens:controllers.map(c=>c.state.screen)}}).catch(()=>{});}
 function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
 root.querySelectorAll('.fd-stage').forEach((stage,index)=>{
  stage.append(templates.get('shell').content.cloneNode(true));
  const main=stage.querySelector('main');
  const state={screen:pages.includes(initial.screens?.[index])?initial.screens[index]:'search',tab:'services',available:false,cta:'I’d like to book here'};
  function sync(){
   main.querySelectorAll('[data-interest]').forEach(l=>l.textContent=shared.interested?'Interest saved':state.cta);
   const notify=main.querySelector('[data-control=notify]');if(notify)notify.checked=shared.notify;
   if(state.screen==='search'){
    const tabs=stage.dataset.layout==='tabs';
    main.querySelector('.fd-tabs').hidden=!tabs;
    main.querySelector('[data-control=available]').checked=state.available;
    main.querySelector('[data-part=services]').hidden=tabs&&state.tab==='businesses';
    main.querySelector('[data-part=businesses]').hidden=state.available||(tabs&&state.tab!=='businesses');
    main.querySelector('[data-part=excluded]').hidden=!state.available;
    main.querySelectorAll('.fd-tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.go===state.tab+'-tab')));
   }
  }
  function render(){main.replaceChildren(templates.get(state.screen).content.cloneNode(true));sync();icons();}
  function navigate(screen){state.screen=screen;render();persist();}
  stage.addEventListener('click',event=>{
   const target=event.target.closest('[data-go]');if(!target)return;const action=target.dataset.go;
   if(action==='interest'){shared.interested=true;controllers.forEach(c=>c.sync());navigate('saved');}
   else if(action==='undo'){shared.interested=false;shared.notify=false;controllers.forEach(c=>c.sync());navigate('detail');}
   else if(action==='services-tab'||action==='businesses-tab'){state.tab=action.split('-')[0];sync();persist();}
   else if(pages.includes(action))navigate(action);
  });
  stage.addEventListener('change',event=>{
   const control=event.target.dataset.control;
   if(control==='available'){state.available=event.target.checked;sync();}
   if(control==='notify'){shared.notify=event.target.checked;main.querySelector('[data-part=status]').textContent=shared.notify?'Notification preference saved.':'Notifications are off.';controllers.forEach(c=>c.sync());persist();}
   if(control==='method'){
    const manual=event.target.value==='manual';main.querySelector('[data-part=email]').hidden=manual;main.querySelector('[name=email]').required=!manual;
    main.querySelector('[data-part=help]').textContent=manual?'We’ll arrange a manual review of your authority. You can discuss suitable evidence with the review team.':'We’ll verify your email and review your authority. Email access alone does not grant control.';
   }
  });
  stage.addEventListener('submit',event=>{
   event.preventDefault();
   if(event.target.dataset.form==='claim')navigate('pending');
   if(event.target.dataset.form==='report')main.querySelector('[data-part=status]').textContent='Preview: this report would be sent for review.';
  });
  controllers.push({state,sync,render});render();
  if(globalThis.Tweak){const tweak=new Tweak({container:stage.querySelector('.fd-phone'),onChange:sync});tweak.addSelect(state,'cta',{label:'Interest button wording',options:['I’d like to book here','Bring this business to FitsMyTime','I’m interested']});}
 });
 window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.privateContent;if(!incoming)return;shared.interested=!!incoming.interested;shared.notify=!!incoming.notify;controllers.forEach((c,index)=>{if(pages.includes(incoming.screens?.[index]))c.state.screen=incoming.screens[index];c.render();});});
})();
</script>
