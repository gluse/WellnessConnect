# The database and Supabase services remain on an internal Docker network.
# Only this fixed TCP relay joins the ingress network; host ports bind 127.0.0.1.
global
    maxconn 128
defaults
    mode tcp
    timeout connect 5s
    timeout client 5m
    timeout server 5m
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
listen app_database
    bind :54322
    server database supabase_db_fitsmytime-local:5432 resolvers docker init-addr libc,none
listen audit_database
    bind :54332
    server database fitsmytime-local-audit:5432 resolvers docker init-addr libc,none
listen supabase_api
    bind :54321
    server gateway supabase_kong_fitsmytime-local:8000 resolvers docker init-addr libc,none
listen test_mail
    bind :54324
    server mail supabase_inbucket_fitsmytime-local:8025 resolvers docker init-addr libc,none
